name: Daily market ingest

# Pulls every card's price, appends today's snapshot to the history files, and commits
# public/data back to the repo. A redeploy (e.g. Vercel) picks up the new data automatically.

on:
  schedule:
    - cron: "37 23 * * *" # after TCGdex's ~22:55 UTC Cardmarket refresh
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Ingest
        run: node scripts/ingest.mjs
        env:
          POKEMONTCG_API_KEY: ${{ secrets.POKEMONTCG_API_KEY }}
      - name: Commit data
        run: |
          git config user.name "pokescout-bot"
          git config user.email "pokescout-bot@users.noreply.github.com"
          git add public/data
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "data: market snapshot $(date -u +%F)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
